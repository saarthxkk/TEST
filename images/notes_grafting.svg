<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#faf8f5"/>
  <text x="400" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">ARTIFICIAL PROPAGATION: GRAFTING</text>
  <text x="400" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#78716c">Joining the desired cutting (Scion) with the rooted plant (Stock)</text>

  <!-- Step 1: Scion & Stock separate -->
  <g transform="translate(60, 80)">
    <!-- Label -->
    <text x="90" y="25" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#78716c">1. PREPARATION</text>
    
    <!-- Scion (Top) -->
    <path d="M 75 50 L 105 50 L 105 100 L 90 130 L 75 100 Z" fill="#86efac" stroke="#166534" stroke-width="2"/>
    <!-- Leaves on scion -->
    <path d="M 75 65 Q 50 55 45 40 Q 65 45 75 65" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 105 60 Q 130 50 135 35 Q 115 40 105 60" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="90" y="85" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">SCION</text>
    <text x="90" y="100" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle" fill="#15803d">(Desired cutting)</text>

    <!-- Stock (Bottom) -->
    <path d="M 75 160 L 90 190 L 105 160 L 105 260 L 75 260 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
    <!-- Soil -->
    <path d="M 40 260 L 140 260 L 130 280 L 50 280 Z" fill="#78350f" opacity="0.6"/>
    <!-- Roots -->
    <path d="M 90 260 Q 70 290 60 305 M 90 260 Q 95 295 90 310 M 90 260 Q 110 290 120 305" stroke="#451a03" stroke-width="2" fill="none"/>
    <text x="90" y="220" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">STOCK</text>
    <text x="90" y="235" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle" fill="#9a3412">(Rooted plant)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 275 220 L 315 220 M 305 210 L 315 220 L 305 230" stroke="#78716c" stroke-width="2.5" fill="none"/>

  <!-- Step 2: Insertion -->
  <g transform="translate(320, 80)">
    <text x="80" y="25" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#78716c">2. INSERTION</text>
    <!-- Scion inserted into V-cut -->
    <path d="M 65 50 L 95 50 L 95 100 L 80 130 L 65 100 Z" fill="#86efac" stroke="#166534" stroke-width="2"/>
    <path d="M 65 65 Q 40 55 35 40 Q 55 45 65 65" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 95 60 Q 120 50 125 35 Q 105 40 95 60" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    
    <path d="M 65 100 L 80 130 L 95 100 L 95 260 L 65 260 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
    <!-- Soil -->
    <path d="M 30 260 L 130 260 L 120 280 L 40 280 Z" fill="#78350f" opacity="0.6"/>
    <!-- Roots -->
    <path d="M 80 260 Q 60 290 50 305 M 80 260 Q 85 295 80 310 M 80 260 Q 100 290 110 305" stroke="#451a03" stroke-width="2" fill="none"/>

    <text x="80" y="170" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#1c1917">Wedge fit</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 525 220 L 565 220 M 555 210 L 565 220 L 555 230" stroke="#78716c" stroke-width="2.5" fill="none"/>

  <!-- Step 3: Bound & Unified Plant -->
  <g transform="translate(570, 80)">
    <text x="80" y="25" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#78716c">3. TIED &amp; UNITED</text>
    <!-- Scion growing -->
    <path d="M 65 40 L 95 40 L 95 100 L 80 130 L 65 100 Z" fill="#86efac" stroke="#166534" stroke-width="2"/>
    <!-- Rich shoots on Scion -->
    <path d="M 65 55 Q 30 40 25 20 Q 55 30 65 55" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 95 50 Q 130 35 140 15 Q 110 25 95 50" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 80 40 Q 80 15 90 0 Q 75 10 80 40" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>

    <!-- Stock -->
    <path d="M 65 100 L 80 130 L 95 100 L 95 260 L 65 260 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
    <!-- Wrapped joint with tape/thread -->
    <rect x="60" y="90" width="40" height="40" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="60" y1="98" x2="100" y2="98" stroke="#854d0e" stroke-width="1.5"/>
    <line x1="60" y1="108" x2="100" y2="108" stroke="#854d0e" stroke-width="1.5"/>
    <line x1="60" y1="118" x2="100" y2="118" stroke="#854d0e" stroke-width="1.5"/>

    <!-- Soil -->
    <path d="M 30 260 L 130 260 L 120 280 L 40 280 Z" fill="#78350f" opacity="0.6"/>
    <!-- Roots -->
    <path d="M 80 260 Q 60 290 50 305 M 80 260 Q 85 295 80 310 M 80 260 Q 100 290 110 305" stroke="#451a03" stroke-width="2" fill="none"/>

    <text x="80" y="200" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#15803d">Stock provides water</text>
    <text x="80" y="215" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#15803d">&amp; nutrients to Scion</text>
  </g>
</svg>
