<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#faf8f5"/>
  <text x="400" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">MALE &amp; FEMALE REPRODUCTIVE ORGANS OF A FLOWER</text>
  <text x="400" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#78716c">Stamen (Male Organ) vs Pistil / Carpel (Female Organ)</text>

  <!-- Left: STAMEN (Male) -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="310" height="320" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="155" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b45309">STAMEN (Male Reproductive Part)</text>

    <!-- Stamen drawing -->
    <path d="M 120 270 Q 110 180 120 120" stroke="#ca8a04" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Anther (Two lobes) -->
    <path d="M 100 115 C 95 90 120 80 125 98 C 130 80 155 90 150 115 C 145 130 130 132 125 120 C 120 132 105 130 100 115 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
    
    <!-- Pollen grains floating -->
    <circle cx="155" cy="85" r="3" fill="#eab308"/>
    <circle cx="165" cy="95" r="2.5" fill="#eab308"/>
    <circle cx="160" cy="110" r="3" fill="#eab308"/>
    <circle cx="170" cy="120" r="2" fill="#eab308"/>

    <!-- Labels -->
    <line x1="145" y1="105" x2="220" y2="105" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="225" y="102" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">ANTHER</text>
    <text x="225" y="117" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Carries pollen grains</text>

    <line x1="165" y1="95" x2="220" y2="70" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="225" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ca8a04">POLLEN GRAINS</text>
    <text x="225" y="81" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Produce male gametes</text>

    <line x1="115" y1="200" x2="220" y2="200" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="225" y="197" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">FILAMENT</text>
    <text x="225" y="212" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Slender stalk</text>
    
    <rect x="20" y="270" width="270" height="35" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="155" y="292" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#854d0e">STAMEN = FILAMENT + ANTHER</text>
  </g>

  <!-- Right: PISTIL / CARPEL (Female) -->
  <g transform="translate(430, 75)">
    <rect x="0" y="0" width="310" height="320" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="155" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">PISTIL / CARPEL (Female Part)</text>

    <!-- Pistil drawing -->
    <!-- Stigma -->
    <ellipse cx="110" cy="90" rx="20" ry="8" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <!-- Style -->
    <path d="M 103 98 L 103 175 L 117 175 L 117 98 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <!-- Ovary -->
    <path d="M 103 175 C 60 185 60 255 110 260 C 160 255 160 185 117 175 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <!-- Ovules inside ovary -->
    <ellipse cx="98" cy="215" rx="6" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <ellipse cx="122" cy="215" rx="6" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <ellipse cx="98" cy="238" rx="6" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <ellipse cx="122" cy="238" rx="6" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>

    <!-- Labels -->
    <line x1="130" y1="90" x2="205" y2="90" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="210" y="87" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">STIGMA</text>
    <text x="210" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Sticky top receives pollen</text>

    <line x1="117" y1="140" x2="205" y2="140" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="210" y="137" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">STYLE</text>
    <text x="210" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Pollen tube passes through</text>

    <line x1="135" y1="195" x2="205" y2="195" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="210" y="192" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#15803d">OVARY</text>
    <text x="210" y="207" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Becomes the FRUIT</text>

    <line x1="128" cy1="230" x2="205" y2="235" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="210" y="232" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ca8a04">OVULE</text>
    <text x="210" y="247" font-family="'Inter', sans-serif" font-size="10" fill="#78716c">Becomes the SEED</text>

    <rect x="20" y="270" width="270" height="35" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="155" y="292" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">PISTIL = STIGMA + STYLE + OVARY</text>
  </g>
</svg>
