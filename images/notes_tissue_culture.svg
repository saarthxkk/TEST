<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#faf8f5"/>
  <text x="440" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">PLANT TISSUE CULTURE (MICROPROPAGATION)</text>
  <text x="440" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#78716c">Explant &rarr; Nutrient Medium &rarr; Callus Formation &rarr; Plantlets &rarr; Soil Potting</text>

  <!-- Step 1: Explant -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="65" y="30" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">1. EXPLANT</text>
    
    <!-- Plant tip with tissue excised -->
    <path d="M 65 190 L 65 100" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
    <path d="M 65 130 Q 35 120 30 95 Q 55 105 65 130" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
    <path d="M 65 115 Q 95 105 100 80 Q 75 90 65 115" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
    
    <!-- Cut tissue piece -->
    <circle cx="65" cy="70" r="8" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="65" y="215" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">Growing tissue taken</text>
    <text x="65" y="228" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">from parent plant</text>
  </g>

  <path d="M 180 200 L 205 200 M 198 193 L 205 200 L 198 207" stroke="#a8a29e" stroke-width="2" fill="none"/>

  <!-- Step 2: Medium + Explant -->
  <g transform="translate(215, 80)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="65" y="30" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">2. INOCULATION</text>
    
    <!-- Test Tube -->
    <path d="M 45 60 L 45 170 C 45 185 85 185 85 170 L 85 60" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="65" cy="60" rx="20" ry="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <!-- Agar medium -->
    <path d="M 46 140 L 46 170 C 46 183 84 183 84 170 L 84 140 Z" fill="#fef08a" opacity="0.8"/>
    <!-- Explant in medium -->
    <circle cx="65" cy="148" r="6" fill="#ca8a04"/>

    <text x="65" y="215" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">Placed on sterile</text>
    <text x="65" y="228" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">nutrient jelly medium</text>
  </g>

  <path d="M 355 200 L 380 200 M 373 193 L 380 200 L 373 207" stroke="#a8a29e" stroke-width="2" fill="none"/>

  <!-- Step 3: Callus Formation -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="65" y="30" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">3. CALLUS</text>
    
    <path d="M 45 60 L 45 170 C 45 185 85 185 85 170 L 85 60" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="65" cy="60" rx="20" ry="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 46 140 L 46 170 C 46 183 84 183 84 170 L 84 140 Z" fill="#fef08a" opacity="0.8"/>
    
    <!-- Cell mass (Callus) -->
    <g transform="translate(65, 145)">
      <circle cx="-5" cy="-4" r="5" fill="#84cc16"/>
      <circle cx="4" cy="-3" r="6" fill="#65a30d"/>
      <circle cx="-2" cy="4" r="6" fill="#4d7c0f"/>
      <circle cx="5" cy="3" r="5" fill="#84cc16"/>
    </g>

    <text x="65" y="215" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">Cells divide rapidly</text>
    <text x="65" y="228" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">into cell mass (Callus)</text>
  </g>

  <path d="M 530 200 L 555 200 M 548 193 L 555 200 L 548 207" stroke="#a8a29e" stroke-width="2" fill="none"/>

  <!-- Step 4: Plantlet Formation -->
  <g transform="translate(565, 80)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="65" y="30" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">4. PLANTLET</text>
    
    <path d="M 45 60 L 45 170 C 45 185 85 185 85 170 L 85 60" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="65" cy="60" rx="20" ry="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 46 140 L 46 170 C 46 183 84 183 84 170 L 84 140 Z" fill="#fef08a" opacity="0.8"/>
    
    <!-- Plantlet growing inside tube -->
    <path d="M 65 145 L 65 95" stroke="#16a34a" stroke-width="3"/>
    <path d="M 65 115 Q 45 105 40 90 Q 60 98 65 115" fill="#22c55e"/>
    <path d="M 65 100 Q 85 90 90 75 Q 70 85 65 100" fill="#4ade80"/>
    <path d="M 65 145 Q 55 160 50 172 M 65 145 Q 75 160 80 172" stroke="#854d0e" stroke-width="1.5" fill="none"/>

    <text x="65" y="215" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">Hormones stimulate</text>
    <text x="65" y="228" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">shoots and roots</text>
  </g>

  <path d="M 705 200 L 730 200 M 723 193 L 730 200 L 723 207" stroke="#a8a29e" stroke-width="2" fill="none"/>

  <!-- Step 5: Soil Potting -->
  <g transform="translate(740, 80)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="65" y="30" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">5. NEW PLANT</text>
    
    <!-- Pot -->
    <path d="M 35 155 L 95 155 L 85 190 L 45 190 Z" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Plant in pot -->
    <path d="M 65 155 L 65 85" stroke="#16a34a" stroke-width="4"/>
    <path d="M 65 130 Q 30 115 25 90 Q 55 105 65 130" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
    <path d="M 65 110 Q 100 95 105 70 Q 75 85 65 110" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
    <path d="M 65 85 Q 50 65 55 45 Q 75 60 65 85" fill="#4ade80" stroke="#15803d" stroke-width="1"/>

    <text x="65" y="215" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">Hardened &amp; grown</text>
    <text x="65" y="228" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#44403c">in nursery/soil</text>
  </g>
</svg>
