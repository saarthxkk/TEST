<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#78716c" stroke-width="1.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#0284c7"/>
    </marker>
    <radialGradient id="bob-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="bob-side-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="300" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">OSCILLATION OF A SIMPLE PENDULUM</text>
  <text x="300" y="46" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Complete Cycle: Position A → B → C → B → A (One Oscillation)</text>

  <!-- Fixed Support -->
  <rect x="200" y="60" width="200" height="14" fill="url(#hatch)" stroke="#44403c" stroke-width="1.5"/>
  <line x1="180" y1="74" x2="420" y2="74" stroke="#1c1917" stroke-width="2.5"/>
  <circle cx="300" cy="74" r="3.5" fill="#1c1917"/>

  <text x="430" y="70" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#44403c">Rigid Support</text>
  <line x1="390" y1="67" x2="425" y2="67" stroke="#78716c" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Motion Path Arc (dotted) -->
  <path d="M 170 260 Q 300 300 430 260" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Left Extreme (A) String & Bob -->
  <line x1="300" y1="74" x2="170" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="170" cy="260" r="16" fill="url(#bob-side-grad)" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="265" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">A</text>
  <text x="170" y="296" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#475569">Extreme Position A</text>

  <!-- Right Extreme (C) String & Bob -->
  <line x1="300" y1="74" x2="430" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="430" cy="260" r="16" fill="url(#bob-side-grad)" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="265" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">C</text>
  <text x="430" y="296" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#475569">Extreme Position C</text>

  <!-- Mean Position (B) String & Bob (Solid) -->
  <line x1="300" y1="74" x2="300" y2="275" stroke="#1c1917" stroke-width="2"/>
  <circle cx="300" cy="275" r="18" fill="url(#bob-grad)" stroke="#78350f" stroke-width="2"/>
  <text x="300" y="280" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">B</text>
  <text x="300" y="312" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b45309">Mean Position (B)</text>

  <!-- Labels -->
  <!-- String label -->
  <line x1="300" y1="160" x2="230" y2="160" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="220" y="164" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="end" fill="#44403c">Thread / String</text>

  <!-- Metallic Bob label -->
  <line x1="320" y1="275" x2="370" y2="235" stroke="#78716c" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="375" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#44403c">Metallic Bob</text>

  <!-- Direction Arrows -->
  <!-- A to B to C -->
  <path d="M 185 240 Q 300 270 415 240" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C to B to A -->
  <path d="M 415 320 Q 300 350 185 320" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-rev)"/>
  <text x="300" y="344" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#0369a1">A → B → C → B → A (1 Oscillation)</text>
</svg>
