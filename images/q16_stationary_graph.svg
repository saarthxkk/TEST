<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <marker id="axis-arrow-q16" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="300" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">DISTANCE &ndash; TIME GRAPH WITH STATIONARY SECTION</text>

  <!-- Graph Grid Background -->
  <!-- Origin at (90, 330). Width 450 (12 min -> 37.5px per min, 75px per 2 min).
       Height 240 (from y=330 to y=90, 400m -> 60px per 100m).
       0m -> 330
       100m -> 270
       200m -> 210
       300m -> 150
       400m -> 90
       0 min -> 90
       2 min -> 165
       4 min -> 240
       6 min -> 315
       8 min -> 390
       10 min -> 465
       12 min -> 540 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <!-- Horizontal grid lines for Y = 0, 100, 200, 300, 400 -->
    <line x1="90" y1="330" x2="555" y2="330"/>
    <line x1="90" y1="270" x2="555" y2="270"/>
    <line x1="90" y1="210" x2="555" y2="210"/>
    <line x1="90" y1="150" x2="555" y2="150"/>
    <line x1="90" y1="90" x2="555" y2="90"/>

    <!-- Vertical grid lines for X = 0, 2, 4, 6, 8, 10, 12 -->
    <line x1="90" y1="330" x2="90" y2="80"/>
    <line x1="165" y1="330" x2="165" y2="80"/>
    <line x1="240" y1="330" x2="240" y2="80"/>
    <line x1="315" y1="330" x2="315" y2="80"/>
    <line x1="390" y1="330" x2="390" y2="80"/>
    <line x1="465" y1="330" x2="465" y2="80"/>
    <line x1="540" y1="330" x2="540" y2="80"/>
  </g>

  <!-- Stationary Section Highlight Shade -->
  <rect x="240" y="90" width="150" height="240" fill="#fee2e2" opacity="0.35"/>

  <!-- Axes -->
  <!-- X Axis -->
  <line x1="90" y1="330" x2="565" y2="330" stroke="#1c1917" stroke-width="2" marker-end="url(#axis-arrow-q16)"/>
  <!-- Y Axis -->
  <line x1="90" y1="330" x2="90" y2="70" stroke="#1c1917" stroke-width="2" marker-end="url(#axis-arrow-q16)"/>

  <!-- Y Axis Ticks & Labels -->
  <text x="80" y="334" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" fill="#44403c">0</text>
  <text x="80" y="274" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" fill="#44403c">100</text>
  <text x="80" y="214" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" fill="#44403c">200</text>
  <text x="80" y="154" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" fill="#44403c">300</text>
  <text x="80" y="94" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" fill="#44403c">400</text>

  <text x="35" y="200" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917" transform="rotate(-90 35 200)" text-anchor="middle">Distance (metres) &rarr;</text>

  <!-- X Axis Ticks & Labels -->
  <text x="90" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">0</text>
  <text x="165" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">2</text>
  <text x="240" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">4</text>
  <text x="315" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">6</text>
  <text x="390" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">8</text>
  <text x="465" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">10</text>
  <text x="540" y="352" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" fill="#44403c">12</text>

  <text x="315" y="380" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">Time (minutes) &rarr;</text>

  <!-- Section 1 (0 to 4 min): (90, 330) -> (240, 210) -->
  <line x1="90" y1="330" x2="240" y2="210" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Section 2 (4 to 8 min): (240, 210) -> (390, 210) -->
  <line x1="240" y1="210" x2="390" y2="210" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- Section 3 (8 to 12 min): (390, 210) -> (540, 90) -->
  <line x1="390" y1="210" x2="540" y2="90" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Plotted Key Points -->
  <circle cx="90" cy="330" r="5" fill="#0369a1" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="240" cy="210" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="390" cy="210" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="540" cy="90" r="5" fill="#0369a1" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Section Annotations -->
  <text x="160" y="250" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#0369a1" transform="rotate(-38 160 250)">Moving (0-4 min)</text>
  
  <rect x="255" y="170" width="120" height="24" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="315" y="186" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#dc2626">Stationary (4-8 min)</text>
  
  <text x="460" y="130" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#0369a1" transform="rotate(-38 460 130)">Moving (8-12 min)</text>
</svg>
