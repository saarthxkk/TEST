<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="598" height="338" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="300" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">CIRCUIT DIAGRAM &mdash; TWO CELLS IN A ROW</text>
  <text x="300" y="52" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Question 22: Observe cell terminal connections</text>

  <!-- Circuit rectangle: 100 to 500 x, 90 to 270 y -->
  <!-- Top wire with two cells facing each other (+ facing +) -->
  <line x1="120" y1="90" x2="230" y2="90" stroke="#1c1917" stroke-width="2.5"/>
  
  <!-- Cell 1: Left is negative (short thick), right is positive (long thin) -->
  <!-- Negative line -->
  <line x1="230" y1="75" x2="230" y2="105" stroke="#1c1917" stroke-width="4.5"/>
  <text x="225" y="70" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#78716c">&minus;</text>
  <!-- Positive line -->
  <line x1="250" y1="65" x2="250" y2="115" stroke="#1c1917" stroke-width="2"/>
  <text x="252" y="60" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#dc2626">+</text>

  <!-- Wire between cells -->
  <line x1="250" y1="90" x2="350" y2="90" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Cell 2: REVERSED - Left is positive (long thin), right is negative (short thick) -->
  <!-- Positive line -->
  <line x1="350" y1="65" x2="350" y2="115" stroke="#1c1917" stroke-width="2"/>
  <text x="345" y="60" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#dc2626">+</text>
  <!-- Negative line -->
  <line x1="370" y1="75" x2="370" y2="105" stroke="#1c1917" stroke-width="4.5"/>
  <text x="373" y="70" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#78716c">&minus;</text>

  <!-- Top wire continuation -->
  <line x1="370" y1="90" x2="480" y2="90" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Right wire going down -->
  <line x1="480" y1="90" x2="480" y2="155" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Bulb on right side -->
  <circle cx="480" cy="180" r="22" fill="#f5f5f4" stroke="#1c1917" stroke-width="2.5"/>
  <!-- Filament loop -->
  <path d="M 470 190 Q 470 172 476 172 Q 480 166 480 178 Q 480 166 484 172 Q 490 172 490 190" fill="none" stroke="#44403c" stroke-width="2"/>
  <line x1="470" y1="190" x2="470" y2="202" stroke="#1c1917" stroke-width="2"/>
  <line x1="490" y1="190" x2="490" y2="202" stroke="#1c1917" stroke-width="2"/>
  <text x="520" y="185" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#1c1917">Bulb (OFF)</text>

  <!-- Right wire bottom -->
  <line x1="480" y1="202" x2="480" y2="270" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Bottom wire -->
  <line x1="480" y1="270" x2="120" y2="270" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Left wire with closed switch -->
  <line x1="120" y1="270" x2="120" y2="200" stroke="#1c1917" stroke-width="2.5"/>
  <!-- Switch dots and closed bridge -->
  <circle cx="120" cy="200" r="4" fill="#1c1917"/>
  <circle cx="120" cy="160" r="4" fill="#1c1917"/>
  <line x1="120" y1="200" x2="120" y2="160" stroke="#1c1917" stroke-width="3"/>
  <text x="60" y="184" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#15803d">Switch (ON)</text>

  <!-- Left wire top -->
  <line x1="120" y1="160" x2="120" y2="90" stroke="#1c1917" stroke-width="2.5"/>

  <!-- Annotation callout for positive terminals facing each other -->
  <rect x="235" y="125" width="130" height="26" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" rx="4"/>
  <text x="300" y="142" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#dc2626">+ facing + (wrong)</text>
  <line x1="270" y1="125" x2="255" y2="117" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="330" y1="125" x2="345" y2="117" stroke="#dc2626" stroke-width="1.5"/>

  <text x="300" y="315" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" fill="#57534e">The two positive terminals (longer lines) touch each other in the middle.</text>
</svg>
