<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="658" height="418" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="330" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">INTERNAL STRUCTURE OF AN ELECTRIC BELL</text>
  <text x="330" y="46" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Question 25: Follow the sequence of operations from P to T</text>

  <!-- Battery & Switch on the Left -->
  <g transform="translate(60, 160)">
    <!-- Battery -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#1c1917" stroke-width="2"/>
    <line x1="30" y1="-16" x2="30" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="40" y1="-10" x2="40" y2="10" stroke="#1c1917" stroke-width="4"/>
    <line x1="50" y1="-16" x2="50" y2="16" stroke="#1c1917" stroke-width="2"/>
    <line x1="60" y1="-10" x2="60" y2="10" stroke="#1c1917" stroke-width="4"/>
    <line x1="60" y1="0" x2="90" y2="0" stroke="#1c1917" stroke-width="2"/>
    <text x="45" y="32" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle" fill="#78716c">Battery</text>
    
    <!-- Push button switch -->
    <path d="M 0 0 L 0 100 L 40 100" fill="none" stroke="#1c1917" stroke-width="2"/>
    <circle cx="40" cy="100" r="3.5" fill="#1c1917"/>
    <circle cx="65" cy="100" r="3.5" fill="#1c1917"/>
    <line x1="38" y1="94" x2="67" y2="94" stroke="#dc2626" stroke-width="2.5"/> <!-- Push button -->
    <line x1="52" y1="94" x2="52" y2="84" stroke="#dc2626" stroke-width="2"/>
    <rect x="44" y="80" width="16" height="5" fill="#dc2626" rx="1"/>
    <text x="52" y="120" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" fill="#78716c">Push Button</text>
    <path d="M 65 100 L 90 100 L 90 0" fill="none" stroke="#1c1917" stroke-width="2"/>
  </g>

  <!-- Electromagnet Coils (P): Two bobbins on U-shaped iron core -->
  <g transform="translate(200, 100)">
    <!-- Iron Yoke Base -->
    <rect x="0" y="20" width="18" height="150" fill="#64748b" stroke="#334155" stroke-width="1.5" rx="2"/>
    <!-- Top Pole Core -->
    <rect x="18" y="30" width="90" height="24" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <!-- Bottom Pole Core -->
    <rect x="18" y="136" width="90" height="24" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- Wire coils (P) wound on cores -->
    <!-- Top Bobbin -->
    <rect x="25" y="24" width="70" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="3"/>
    <g stroke="#b45309" stroke-width="2.5">
      <line x1="33" y1="24" x2="33" y2="60"/>
      <line x1="43" y1="24" x2="43" y2="60"/>
      <line x1="53" y1="24" x2="53" y2="60"/>
      <line x1="63" y1="24" x2="63" y2="60"/>
      <line x1="73" y1="24" x2="73" y2="60"/>
      <line x1="83" y1="24" x2="83" y2="60"/>
    </g>

    <!-- Bottom Bobbin -->
    <rect x="25" y="130" width="70" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="3"/>
    <g stroke="#b45309" stroke-width="2.5">
      <line x1="33" y1="130" x2="33" y2="166"/>
      <line x1="43" y1="130" x2="43" y2="166"/>
      <line x1="53" y1="130" x2="53" y2="166"/>
      <line x1="63" y1="130" x2="63" y2="166"/>
      <line x1="73" y1="130" x2="73" y2="166"/>
      <line x1="83" y1="130" x2="83" y2="166"/>
    </g>

    <!-- Connecting wire between bobbins -->
    <path d="M 60 60 Q 40 95 60 130" fill="none" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Wires connecting battery to coil and to contact screw -->
  <line x1="150" y1="160" x2="225" y2="60" stroke="#1c1917" stroke-width="2"/>
  <path d="M 225 166 L 225 320 L 400 320" fill="none" stroke="#1c1917" stroke-width="2"/>

  <!-- Soft Iron Armature & Hammer (Q) and Flexible Strip (T) -->
  <g transform="translate(340, 110)">
    <!-- Flexible steel spring strip (T) mounted at bottom post -->
    <rect x="-10" y="170" width="20" height="20" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
    <text x="0" y="205" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" fill="#78716c">Fixed Base</text>
    
    <!-- Spring Steel Strip (T) -->
    <path d="M 0 170 Q 2 90 0 10" fill="none" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Soft Iron Armature piece attached to spring -->
    <rect x="-6" y="20" width="12" height="140" fill="#64748b" stroke="#1e293b" stroke-width="1.5" rx="2"/>

    <!-- Hammer Rod attached to top of armature -->
    <line x1="0" y1="30" x2="110" y2="30" stroke="#475569" stroke-width="3"/>
    <!-- Hammer Head ball -->
    <circle cx="110" cy="30" r="10" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Gong (R) on the upper right -->
  <g transform="translate(520, 140)">
    <path d="M 0 -70 A 70 70 0 0 1 0 70 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#713f12"/>
    <line x1="0" y1="0" x2="35" y2="0" stroke="#713f12" stroke-width="4"/>
  </g>

  <!-- Contact Screw (S) touching back of strip -->
  <g transform="translate(370, 200)">
    <!-- Screw Support Bracket -->
    <path d="M 30 120 L 30 0 L 0 0" fill="none" stroke="#475569" stroke-width="4"/>
    <!-- Contact Screw body -->
    <line x1="15" y1="0" x2="-28" y2="0" stroke="#eab308" stroke-width="3.5"/>
    <rect x="15" y="-6" width="10" height="12" fill="#ca8a04" rx="1"/> <!-- screw head -->
    <!-- Point of contact with spring -->
    <circle cx="-28" cy="0" r="3" fill="#dc2626"/>
  </g>

  <!-- Wire from Contact Screw to Battery -->
  <path d="M 400 320 L 400 200" fill="none" stroke="#1c1917" stroke-width="2"/>

  <!-- LABELS WITH BOXES AND LEADER LINES -->
  <!-- Label P: Electromagnet -->
  <g transform="translate(250, 70)">
    <rect x="-11" y="-11" width="22" height="22" fill="#d97706" rx="3"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
    <text x="18" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#d97706">Coil &amp; Core</text>
  </g>

  <!-- Label Q: Armature & Hammer -->
  <g transform="translate(400, 80)">
    <rect x="-11" y="-11" width="22" height="22" fill="#475569" rx="3"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
    <text x="18" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#475569">Hammer &amp; Armature</text>
    <line x1="-11" y1="0" x2="-50" y2="30" stroke="#475569" stroke-width="1.2"/>
  </g>

  <!-- Label R: Metal Gong -->
  <g transform="translate(560, 80)">
    <rect x="-11" y="-11" width="22" height="22" fill="#ca8a04" rx="3"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
    <text x="18" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#ca8a04">Gong</text>
  </g>

  <!-- Label S: Contact Screw -->
  <g transform="translate(450, 240)">
    <rect x="-11" y="-11" width="22" height="22" fill="#dc2626" rx="3"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <text x="18" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#dc2626">Contact Screw</text>
    <line x1="-11" y1="-5" x2="-80" y2="-40" stroke="#dc2626" stroke-width="1.2"/>
  </g>

  <!-- Label T: Flexible Spring Strip -->
  <g transform="translate(290, 260)">
    <rect x="-11" y="-11" width="22" height="22" fill="#0284c7" rx="3"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
    <text x="18" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#0284c7">Steel Spring Strip</text>
    <line x1="11" y1="0" x2="48" y2="-30" stroke="#0284c7" stroke-width="1.2"/>
  </g>

  <!-- Bottom Explanatory Caption -->
  <text x="330" y="390" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" fill="#57534e">Armature pulled &rarr; hammer strikes gong &rarr; contact breaks at screw S &rarr; core loses magnetism &rarr; strip T springs back.</text>
</svg>
