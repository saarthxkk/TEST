<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="658" height="358" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="330" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">HOUSEHOLD CIRCUIT WITH FUSE &amp; MULTIPLE APPLIANCES</text>
  <text x="330" y="48" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Question 26: Note the placement of Fuse (F) in series with the main socket (S)</text>

  <!-- Mains Supply on Left -->
  <g transform="translate(60, 180)">
    <rect x="-30" y="-80" width="60" height="160" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5" rx="4"/>
    <text x="0" y="-40" font-family="'Space Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1c1917">220 V</text>
    <text x="0" y="-24" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" fill="#78716c">AC MAINS</text>
    <text x="0" y="-8" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" fill="#78716c">SUPPLY</text>

    <!-- Terminals: Live & Neutral -->
    <circle cx="20" cy="30" r="4" fill="#dc2626"/>
    <text x="2" y="33" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#dc2626">L</text>
    <circle cx="20" cy="60" r="4" fill="#1e40af"/>
    <text x="2" y="63" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#1e40af">N</text>
  </g>

  <!-- Neutral wire running along bottom directly to socket -->
  <line x1="80" y1="240" x2="330" y2="240" stroke="#1e40af" stroke-width="2.5"/>

  <!-- Live wire with Fuse 'F' in series -->
  <line x1="80" y1="210" x2="160" y2="210" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Fuse F Symbol / Box -->
  <g transform="translate(160, 195)">
    <!-- Fuse Rectangle with line passing through -->
    <rect x="0" y="0" width="70" height="30" fill="#ffffff" stroke="#1c1917" stroke-width="2" rx="3"/>
    <!-- Thin fuse wire inside -->
    <path d="M 0 15 Q 18 8, 35 15 T 70 15" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Fuse Caps -->
    <rect x="0" y="0" width="10" height="30" fill="#94a3b8" stroke="#1c1917" stroke-width="1.5"/>
    <rect x="60" y="0" width="10" height="30" fill="#94a3b8" stroke="#1c1917" stroke-width="1.5"/>

    <!-- Label F -->
    <rect x="23" y="-32" width="24" height="24" fill="#dc2626" rx="4"/>
    <text x="35" y="-16" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">F</text>
    <text x="35" y="46" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Fuse (in series)</text>
  </g>

  <!-- Live wire from Fuse to Socket S -->
  <line x1="230" y1="210" x2="330" y2="210" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Socket Box 'S' -->
  <g transform="translate(330, 185)">
    <rect x="0" y="0" width="55" height="70" fill="#ffffff" stroke="#44403c" stroke-width="2" rx="4"/>
    <circle cx="20" cy="25" r="4.5" fill="#1c1917"/>
    <circle cx="35" cy="25" r="4.5" fill="#1c1917"/>
    <circle cx="27" cy="48" r="6" fill="#1c1917"/>
    <rect x="15" y="-30" width="24" height="24" fill="#44403c" rx="4"/>
    <text x="27" y="-14" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <text x="27" y="86" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#44403c" text-anchor="middle">Multi-Socket</text>
  </g>

  <!-- Wires branching out to 3 appliances in parallel -->
  <!-- Top Branch: Electric Heater -->
  <g transform="translate(440, 95)">
    <!-- Appliance Box -->
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#ea580c" stroke-width="2" rx="6"/>
    <!-- Heating element icon -->
    <path d="M 12 21 Q 20 12, 28 21 T 44 21 T 60 21" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <text x="70" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">Electric Heater</text>
    <text x="145" y="38" font-family="'Space Mono', monospace" font-size="9" fill="#78716c">1500 W</text>
  </g>

  <!-- Middle Branch: Television -->
  <g transform="translate(440, 165)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="6"/>
    <!-- TV icon screen -->
    <rect x="15" y="10" width="30" height="22" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" rx="2"/>
    <text x="65" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">Television (TV)</text>
    <text x="145" y="38" font-family="'Space Mono', monospace" font-size="9" fill="#78716c">120 W</text>
  </g>

  <!-- Bottom Branch: Incandescent Bulb -->
  <g transform="translate(440, 235)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#eab308" stroke-width="2" rx="6"/>
    <circle cx="30" cy="21" r="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 26 24 Q 28 17 30 21 Q 32 17 34 24" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="60" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1c1917">Electric Bulb</text>
    <text x="145" y="38" font-family="'Space Mono', monospace" font-size="9" fill="#78716c">60 W</text>
  </g>

  <!-- Connecting leads from socket S to the 3 branches -->
  <!-- Live rail -->
  <path d="M 385 210 L 415 210" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 415 110 L 415 250" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="415" y1="110" x2="440" y2="110" stroke="#dc2626" stroke-width="2"/>
  <line x1="415" y1="180" x2="440" y2="180" stroke="#dc2626" stroke-width="2"/>
  <line x1="415" y1="250" x2="440" y2="250" stroke="#dc2626" stroke-width="2"/>

  <!-- Return / Neutral rail -->
  <path d="M 385 235 L 430 235" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 430 125 L 430 265" fill="none" stroke="#1e40af" stroke-width="2"/>
  <line x1="430" y1="125" x2="440" y2="125" stroke="#1e40af" stroke-width="2"/>
  <line x1="430" y1="195" x2="440" y2="195" stroke="#1e40af" stroke-width="2"/>
  <line x1="430" y1="265" x2="440" y2="265" stroke="#1e40af" stroke-width="2"/>

  <!-- Bottom Explanatory Caption -->
  <text x="330" y="335" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" fill="#57534e">If excessive current flows through socket S, fuse F melts, opening the whole circuit.</text>
</svg>
