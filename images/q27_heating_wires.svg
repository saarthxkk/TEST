<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" rx="8"/>
  <rect x="1" y="1" width="758" height="378" fill="none" stroke="#e7e5e4" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="380" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1917" letter-spacing="1">FOUR TEST CIRCUITS &mdash; INVESTIGATING HEATING EFFECT</text>
  <text x="380" y="48" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Question 27: Compare wire material, length, and thickness</text>

  <!-- CIRCUIT P -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="160" height="200" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" rx="6"/>
    <!-- Circuit box label -->
    <rect x="68" y="10" width="24" height="24" fill="#1c1917" rx="4"/>
    <text x="80" y="27" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>

    <!-- Top wire with cell -->
    <line x1="25" y1="55" x2="65" y2="55" stroke="#1c1917" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="65" stroke="#1c1917" stroke-width="2"/>
    <line x1="73" y1="49" x2="73" y2="61" stroke="#1c1917" stroke-width="3.5"/>
    <line x1="73" y1="55" x2="135" y2="55" stroke="#1c1917" stroke-width="2"/>

    <!-- Left & Right wires -->
    <line x1="25" y1="55" x2="25" y2="150" stroke="#1c1917" stroke-width="2"/>
    <line x1="135" y1="55" x2="135" y2="150" stroke="#1c1917" stroke-width="2"/>

    <!-- Switch on right wire -->
    <circle cx="135" cy="95" r="3" fill="#1c1917"/>
    <circle cx="135" cy="115" r="3" fill="#1c1917"/>
    <line x1="135" y1="95" x2="135" y2="115" stroke="#15803d" stroke-width="2.5"/>

    <!-- Bottom test wire segment P: COPPER, 10 cm, THICK (brown, 3 coils, thick) -->
    <path d="M 25 150 L 50 150 Q 60 135 70 150 Q 80 165 90 150 Q 100 135 110 150 L 135 150" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>

    <!-- Card Description -->
    <text x="80" y="180" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#b45309">Copper Wire</text>
    <text x="80" y="193" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#78716c">10 cm, thick</text>
  </g>

  <!-- CIRCUIT Q -->
  <g transform="translate(210, 70)">
    <rect x="0" y="0" width="160" height="200" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" rx="6"/>
    <rect x="68" y="10" width="24" height="24" fill="#1c1917" rx="4"/>
    <text x="80" y="27" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>

    <!-- Top wire with cell -->
    <line x1="25" y1="55" x2="65" y2="55" stroke="#1c1917" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="65" stroke="#1c1917" stroke-width="2"/>
    <line x1="73" y1="49" x2="73" y2="61" stroke="#1c1917" stroke-width="3.5"/>
    <line x1="73" y1="55" x2="135" y2="55" stroke="#1c1917" stroke-width="2"/>

    <!-- Left & Right wires -->
    <line x1="25" y1="55" x2="25" y2="150" stroke="#1c1917" stroke-width="2"/>
    <line x1="135" y1="55" x2="135" y2="150" stroke="#1c1917" stroke-width="2"/>

    <!-- Switch on right wire -->
    <circle cx="135" cy="95" r="3" fill="#1c1917"/>
    <circle cx="135" cy="115" r="3" fill="#1c1917"/>
    <line x1="135" y1="95" x2="135" y2="115" stroke="#15803d" stroke-width="2.5"/>

    <!-- Bottom test wire segment Q: NICHROME, 10 cm, THICK (dark slate, 3 coils, thick) -->
    <path d="M 25 150 L 50 150 Q 60 135 70 150 Q 80 165 90 150 Q 100 135 110 150 L 135 150" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Card Description -->
    <text x="80" y="180" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#0284c7">Nichrome Wire</text>
    <text x="80" y="193" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#78716c">10 cm, thick</text>
  </g>

  <!-- CIRCUIT R -->
  <g transform="translate(390, 70)">
    <rect x="0" y="0" width="160" height="200" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" rx="6"/>
    <rect x="68" y="10" width="24" height="24" fill="#1c1917" rx="4"/>
    <text x="80" y="27" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>

    <!-- Top wire with cell -->
    <line x1="25" y1="55" x2="65" y2="55" stroke="#1c1917" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="65" stroke="#1c1917" stroke-width="2"/>
    <line x1="73" y1="49" x2="73" y2="61" stroke="#1c1917" stroke-width="3.5"/>
    <line x1="73" y1="55" x2="135" y2="55" stroke="#1c1917" stroke-width="2"/>

    <!-- Left & Right wires -->
    <line x1="25" y1="55" x2="25" y2="150" stroke="#1c1917" stroke-width="2"/>
    <line x1="135" y1="55" x2="135" y2="150" stroke="#1c1917" stroke-width="2"/>

    <!-- Switch on right wire -->
    <circle cx="135" cy="95" r="3" fill="#1c1917"/>
    <circle cx="135" cy="115" r="3" fill="#1c1917"/>
    <line x1="135" y1="95" x2="135" y2="115" stroke="#15803d" stroke-width="2.5"/>

    <!-- Bottom test wire segment R: NICHROME, 20 cm, THICK (dark slate, 6 coils, thick) -->
    <path d="M 25 150 L 35 150 Q 42 135 50 150 Q 58 165 66 150 Q 74 135 82 150 Q 90 165 98 150 Q 106 135 114 150 Q 122 165 128 150 L 135 150" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Card Description -->
    <text x="80" y="180" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#0284c7">Nichrome Wire</text>
    <text x="80" y="193" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#78716c">20 cm, thick</text>
  </g>

  <!-- CIRCUIT S -->
  <g transform="translate(570, 70)">
    <rect x="0" y="0" width="160" height="200" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" rx="6"/>
    <rect x="68" y="10" width="24" height="24" fill="#1c1917" rx="4"/>
    <text x="80" y="27" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>

    <!-- Top wire with cell -->
    <line x1="25" y1="55" x2="65" y2="55" stroke="#1c1917" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="65" stroke="#1c1917" stroke-width="2"/>
    <line x1="73" y1="49" x2="73" y2="61" stroke="#1c1917" stroke-width="3.5"/>
    <line x1="73" y1="55" x2="135" y2="55" stroke="#1c1917" stroke-width="2"/>

    <!-- Left & Right wires -->
    <line x1="25" y1="55" x2="25" y2="150" stroke="#1c1917" stroke-width="2"/>
    <line x1="135" y1="55" x2="135" y2="150" stroke="#1c1917" stroke-width="2"/>

    <!-- Switch on right wire -->
    <circle cx="135" cy="95" r="3" fill="#1c1917"/>
    <circle cx="135" cy="115" r="3" fill="#1c1917"/>
    <line x1="135" y1="95" x2="135" y2="115" stroke="#15803d" stroke-width="2.5"/>

    <!-- Bottom test wire segment S: NICHROME, 20 cm, THIN (dark slate, 6 coils, THIN 1.8px) -->
    <path d="M 25 150 L 35 150 Q 42 135 50 150 Q 58 165 66 150 Q 74 135 82 150 Q 90 165 98 150 Q 106 135 114 150 Q 122 165 128 150 L 135 150" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Card Description -->
    <text x="80" y="180" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#0284c7">Nichrome Wire</text>
    <text x="80" y="193" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#78716c">20 cm, thin</text>
  </g>

  <!-- Comparison Highlights Table below cards -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="680" height="42" fill="#ffffff" stroke="#e7e5e4" rx="4"/>
    <text x="20" y="26" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#1c1917">PAIR COMPARISONS:</text>
    <text x="170" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#57534e">&bull; P &amp; Q: Material (Copper vs Nichrome)</text>
    <text x="400" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0284c7">&bull; Q &amp; R: Length alone (10 cm vs 20 cm)</text>
    <text x="610" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#57534e">&bull; R &amp; S: Thickness</text>
  </g>
</svg>
