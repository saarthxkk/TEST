<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical and Chemical Changes Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="warning-overlay" class="hidden">
        <div class="warning-content">
            <h1>⚠️ WARNING ⚠️</h1>
            <p>Screen switching is not allowed during the test!</p>
            <p>Please return to the test immediately.</p>
        </div>
    </div>

    <div class="header">
        <div class="header-content">
            <h1>Physical and Chemical Changes Test</h1>
            <p>Level: Medium → Hard | 50 MCQs</p>
        </div>
    </div>

    <div class="container" id="quiz-container">
        <form id="quiz-form">
            <div id="questions-container"></div>
            
            <div class="submit-section">
                <button type="submit" id="submit-btn" class="btn">Submit Test</button>
            </div>
        </form>
    </div>

    <div class="container hidden" id="result-container">
        <div class="result-card">
            <h2>Test Submitted Successfully</h2>
            <div class="score-display">
                <span id="score">0</span> / 50
            </div>
            <p id="score-message"></p>
        </div>
    </div>

    <audio id="warning-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
